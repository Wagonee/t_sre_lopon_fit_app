name: lopon

x-database: &database
  DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-lopon}
  DB_USERNAME: ${DB_USERNAME:?Скопируй .env.example в .env и заполни DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?Скопируй .env.example в .env и заполни DB_PASSWORD}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lopon}
      POSTGRES_USER: ${DB_USERNAME:?Скопируй .env.example в .env и заполни DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Скопируй .env.example в .env и заполни DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: lopon-backend:${APP_VERSION:-dev}
    pull_policy: never
    command: ["migrate"]
    environment: *database
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: lopon-backend:${APP_VERSION:-dev}
    environment:
      <<: *database
      DB_MIGRATE_ON_START: "false"
      JWT_SECRET: ${JWT_SECRET:?Сгенерируй JWT_SECRET командой openssl rand -base64 32 и впиши в .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
    expose:
      - "8080"
      - "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      start_interval: 2s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: lopon-frontend:${APP_VERSION:-dev}
    ports:
      - "${HTTP_PORT:-8000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
